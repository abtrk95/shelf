# HTTPS deployment. Set SHELF_DOMAIN in .env before running docker compose up -d --build.
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      ALLOWED_ORIGINS: https://${SHELF_DOMAIN:?Set SHELF_DOMAIN in .env}
      TRUST_PROXY: "true"
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1800}
      INVITE_TTL_SECONDS: ${INVITE_TTL_SECONDS:-600}
      MAX_SESSIONS: ${MAX_SESSIONS:-2000}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-2147483648}
      STUN_URLS: ${STUN_URLS-stun:stun.cloudflare.com:3478}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      ICE_TRANSPORT_POLICY: ${ICE_TRANSPORT_POLICY:-all}
    expose:
      - "3000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 80
    networks:
      - shelf
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SHELF_DOMAIN: ${SHELF_DOMAIN:?Set SHELF_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - shelf
volumes:
  caddy_data:
  caddy_config:
networks:
  shelf:
